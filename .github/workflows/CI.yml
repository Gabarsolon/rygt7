name: GT7 launcher checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build launcher and test setup, overlays, and logging
        shell: cmd
        run: loader\test-gt7.cmd "%RUNNER_TEMP%\rygt7-launcher-tests"
